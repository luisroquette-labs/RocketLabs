name: Catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Validate catalog
        run: node scripts/validate-catalog.mjs
      - name: Validate builder library
        run: node scripts/validate-library.mjs
      - name: Validate traffic history
        run: node scripts/collect-traffic.mjs --validate
      - name: Check generated README
        run: |
          node scripts/render-readme.mjs
          git diff --exit-code README.md README.en.md
